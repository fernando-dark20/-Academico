<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ritmo Académico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: columna móvil con barra inferior y botón + para agregar. Cada día se lee como una regla horaria (07–23 h):
   clases y actividades con el color propio, estudio en azul eléctrico, tiempo libre en verde. */
:root{
  --bg:#EEF2FB; --surface:#FFFFFF; --surface-2:#E6EBF7; --fg:#101A2E; --muted:#56637E; --line:#D5DCEE;
  --accent:#2F5BFF; --accent-2:#8A4DFF; --accent-fg:#FFFFFF; --accent-soft:#E0E7FF;
  --rest:#0A8F6E; --rest-soft:#D3F5E8;
  --exam:#E5400F; --exam-soft:#FFE2D8;
  --warn:#A25F00; --warn-soft:#FFEFC8;
  --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141B30; --surface-2:#1D2744; --fg:#E9EEFF; --muted:#9FAAC9; --line:#26314F;
    --accent:#7E9BFF; --accent-2:#B084FF; --accent-fg:#0A1030; --accent-soft:#1D2A63;
    --rest:#3DDBB0; --rest-soft:#0E3A32;
    --exam:#FF7A4D; --exam-soft:#43200F;
    --warn:#FFC24A; --warn-soft:#42300A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B30; --surface-2:#1D2744; --fg:#E9EEFF; --muted:#9FAAC9; --line:#26314F;
  --accent:#7E9BFF; --accent-2:#B084FF; --accent-fg:#0A1030; --accent-soft:#1D2A63;
  --rest:#3DDBB0; --rest-soft:#0E3A32;
  --exam:#FF7A4D; --exam-soft:#43200F;
  --warn:#FFC24A; --warn-soft:#42300A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:18px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;display:block}
#sync{font-size:12px;color:var(--muted)}
main{display:grid;gap:16px;min-width:0}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.muted{color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--grad);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--exam);border-color:color-mix(in srgb,var(--exam) 45%,var(--line))}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.time{font-variant-numeric:tabular-nums;font-weight:600;line-height:1.25}
.time small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.body{min-width:0}
.lnk{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%;min-width:0}
.body b{font-weight:600}
.meta{display:block;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.item.is-done .lnk{opacity:.55;text-decoration:line-through}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:baseline}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.exam{background:var(--exam-soft);color:var(--exam)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.rest{background:var(--rest-soft);color:var(--rest)}
.tpill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.chk{position:relative;display:inline-flex;width:44px;height:44px;margin:-10px -10px 0 0;align-items:center;justify-content:center;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:block;position:relative;background:var(--surface)}
.chk input:checked + span{background:var(--grad);border-color:transparent}
.chk input:checked + span::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
/* regla horaria */
.rail{position:relative;height:38px;border-radius:10px;background:var(--rest-soft);overflow:hidden;margin-top:2px}
.seg{position:absolute;top:5px;bottom:5px;border-radius:6px}
.seg.cls{background:color-mix(in srgb,var(--c) 42%,var(--surface));border-left:3px solid var(--c)}
.seg.rst{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 50%,var(--rest-soft)) 0 6px,color-mix(in srgb,var(--c) 22%,var(--rest-soft)) 6px 12px)}
.seg.stu{background:var(--grad)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--exam)}
.ticks{position:relative;height:18px;margin-top:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tk{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k{display:inline-block;width:11px;height:11px;border-radius:3px}
.k.kc{background:color-mix(in srgb,var(--fg) 35%,var(--surface))}
.k.ks{background:var(--grad)}
.k.kf{background:var(--rest-soft);outline:1px solid color-mix(in srgb,var(--rest) 45%,transparent)}
.rem{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.rem.go{cursor:pointer}
.rem:first-child{border-top:0;padding-top:0}
.rem:last-child{padding-bottom:0}
.rem .pill{justify-self:start}
.note{border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.empty{color:var(--muted);padding:6px 0}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;display:grid;gap:1px;justify-items:center}
.dchip .dw{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dchip .dn{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1}
.dchip .dm{width:6px;height:6px;border-radius:50%;background:transparent}
.dchip.has-exam .dm{background:var(--exam)}
.dchip.is-free .dn{color:var(--rest)}
.dchip.sel{background:var(--grad);border-color:transparent;color:var(--accent-fg)}
.dchip.sel .dw,.dchip.sel .dn{color:var(--accent-fg)}
.dchip.sel .dw{opacity:.85}
.dchip.sel.has-exam .dm{background:var(--accent-fg)}
.wrow{display:grid;grid-template-columns:56px minmax(0,1fr) 78px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.wl{font-variant-numeric:tabular-nums;color:var(--muted)}
.wbar{display:flex;height:14px;border-radius:7px;background:var(--rest-soft);overflow:hidden}
.wbar i{display:block;height:100%}
.wbar .wc{background:color-mix(in srgb,var(--fg) 35%,var(--surface))}
.wbar .ws{background:var(--grad)}
.wv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.wv.over{color:var(--warn);font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:14px}
.totals b{font-variant-numeric:tabular-nums}
.ecard{display:grid;gap:8px}
.ehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ehead b{font-family:var(--font-display);font-size:17px;line-height:1.25;font-weight:700}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rest),color-mix(in srgb,var(--rest) 60%,var(--accent)));border-radius:5px}
.erow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:8px}
.step .btn{min-width:36px;padding:0}
.warnline{color:var(--warn);font-size:13.5px;background:var(--warn-soft);border-radius:8px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tchip:has(input:checked){background:color-mix(in srgb,var(--c) 20%,var(--surface));border-color:var(--c);font-weight:700}
.tchip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.slotchip{display:inline-block;font-size:13px;background:color-mix(in srgb,var(--c) 17%,var(--surface));color:color-mix(in srgb,var(--c) 65%,var(--fg));border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums;font-weight:500}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.form{display:grid;gap:14px;margin-top:14px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:13.5px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)
}
textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.srow .x{min-height:44px;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{position:relative;width:36px;height:36px;display:block;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw span{display:block;width:100%;height:100%;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--fg)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.sw.other span{background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7ff,#5856ff,#ff2d92,#ff3b30)}
.sw.other.on span{background:var(--c);box-shadow:0 0 0 3px var(--fg)}
.err{color:var(--exam);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.menu{display:grid;gap:8px;margin-top:14px}
.menu-i{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.menu-i b{font-weight:700}
.menu-i span{color:var(--muted);font-size:13.5px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--grad);color:var(--accent-fg);font-size:32px;line-height:1;cursor:pointer;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:50px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab[aria-current="page"] svg{stroke-width:2.2}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
@media (max-width:380px){
  .rem{grid-template-columns:1fr;gap:4px}
  .srow{grid-template-columns:1fr 1fr 1fr 40px}
  .srow select{grid-column:1/-1}
  .srow .x{grid-row:2;grid-column:4}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.dchip,.tab,.menu-i,.fab,.wrow{transition:background-color .15s,border-color .15s,color .15s,transform .12s}
  .btn:active,.chip:active,.dchip:active,.tab:active,.menu-i:active,.fab:active{transform:scale(.96)}
  .chk input:checked + span{animation:pop .24s ease-out}
  .enter>*{animation:rise .28s ease-out both}
  .enter .bar i,.enter .wbar i{transform-origin:left;animation:grow .6s ease-out both}
  .sheet{animation:slide .22s ease-out}
  @keyframes pop{50%{transform:scale(1.22)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes slide{from{transform:translateY(24px);opacity:.6}}
}
</style>

<div class="app">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="2" y="10" width="22" height="7" rx="3.5" fill="var(--rest-soft)"/><rect x="2" y="10" width="9" height="7" rx="3.5" fill="var(--accent)"/><rect x="12.5" y="10" width="5" height="7" rx="2.5" fill="var(--accent-2)"/></svg>
      Ritmo
    </div>
    <span id="sync" role="status"></span>
  </div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" data-act="fab" aria-label="Agregar">+</button>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button class="tab" data-act="tab" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Hoy</button>
    <button class="tab" data-act="tab" data-tab="agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="tab" data-act="tab" data-tab="evaluaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17"/><path d="M6 4.5h11l-2 3.5 2 3.5H6"/></svg>Pruebas</button>
    <button class="tab" data-act="tab" data-tab="materias"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/></svg>Horario</button>

  </div>
</nav>

<script>
(function(){
'use strict';
/*LOGIC-START*/
const DAYS_S=['lun','mar','mié','jue','vie','sáb','dom'];
const DAYS_L=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MONTHS_S=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const COLORS=['#2F6BFF','#7C4DFF','#E91E8C','#FF5A36','#FF9F1C','#F2C200','#2BB673','#00B8A9','#00A3E0','#FF4D6D','#8BC34A','#B23CFD'];
const TYPES=[
  {k:'Prueba',h:6,c:'#FF5A36'},{k:'Control',h:3,c:'#FF9F1C'},{k:'Entrega',h:5,c:'#7C4DFF'},
  {k:'Exposición',h:4,c:'#E91E8C'},{k:'Examen',h:10,c:'#2F6BFF'},{k:'Tarea',h:2,c:'#2BB673'}
];
const typeOf=k=>TYPES.find(t=>t.k===k)||TYPES[0];
const DAY_START=7*60, DAY_END=23*60;
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const dayDiff=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);};
const wd=s=>(pd(s).getDay()+6)%7;
const tm=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1];};
const mt=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const hrs=m=>(Math.round(m/6)/10).toString().replace('.',',')+' h';
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const subj=(st,id)=>st.subjects.find(s=>s.id===id);
const today=()=>ds(new Date());
const isRestDay=(st,d)=>st.settings.restDays.indexOf(wd(d))>=0||st.freeDates.indexOf(d)>=0;

function normalize(s){
  if(!s||typeof s!=='object') return null;
  const d={studyStart:'15:00',studyEnd:'21:00',maxHours:4,restDays:[6],remindDays:[7,3,1]};
  const st=Object.assign(d,s.settings||{});
  return {v:2,sample:!!s.sample,settings:st,
    subjects:Array.isArray(s.subjects)?s.subjects.map(x=>({id:x.id,name:x.name||'Materia',color:x.color||COLORS[0],slots:Array.isArray(x.slots)?x.slots:[]})):[],
    exams:Array.isArray(s.exams)?s.exams.filter(e=>e&&e.date).map(e=>({id:e.id,subjectId:e.subjectId,type:e.type||'Prueba',title:e.title||'Evaluación',date:e.date,hours:e.hours||6,topics:e.topics||''})):[],
    activities:Array.isArray(s.activities)?s.activities.filter(a=>a&&a.id):[],
    freeDates:Array.isArray(s.freeDates)?s.freeDates:[],
    done:(s.done&&typeof s.done==='object')?s.done:{}};
}
function classIntervals(st,date){
  const w=wd(date),out=[];
  st.subjects.forEach(s=>s.slots.forEach(sl=>{if(sl.d===w)out.push({s:tm(sl.s),e:tm(sl.e),subject:s});}));
  return out.sort((a,b)=>a.s-b.s);
}
function actIntervals(st,date){
  const w=wd(date),out=[];
  st.activities.forEach(a=>{
    const on=a.repeat==='weekly'?(a.days||[]).indexOf(w)>=0:a.date===date;
    if(on)out.push({s:tm(a.s),e:tm(a.e),title:a.title,color:a.color,kind:a.kind,id:a.id});
  });
  return out.sort((a,b)=>a.s-b.s);
}
function freeIntervals(st,date){
  let free=[{s:tm(st.settings.studyStart),e:tm(st.settings.studyEnd)}];
  classIntervals(st,date).concat(actIntervals(st,date)).forEach(c=>{
    const next=[];
    free.forEach(f=>{
      if(c.e<=f.s||c.s>=f.e){next.push(f);return;}
      if(c.s>f.s)next.push({s:f.s,e:c.s});
      if(c.e<f.e)next.push({s:c.e,e:f.e});
    });
    free=next;
  });
  return free.filter(f=>f.e-f.s>=45);
}
function buildPlan(st,t){
  const exams=st.exams.filter(e=>e.date>t).sort(byDate);
  const plan={days:{},short:{},planned:{}};
  if(!exams.length)return plan;
  const n=dayDiff(t,exams[exams.length-1].date);
  const cap={},free={};
  for(let i=0;i<=n;i++){
    const d=addDays(t,i),fr=freeIntervals(st,d);
    free[d]=fr.map(x=>({s:x.s,e:x.e}));
    const fm=fr.reduce((a,x)=>a+(x.e-x.s),0);
    cap[d]=isRestDay(st,d)?0:Math.min(st.settings.maxHours*60,Math.floor(fm*0.85/30)*30);
    plan.days[d]=[];
  }
  exams.forEach(ex=>{
    let done=0;
    Object.keys(st.done).forEach(k=>{const p=k.split('|');if(p[1]===ex.id&&p[0]<t)done+=st.done[k];});
    let need=Math.max(0,Math.ceil((ex.hours*60-done)/30)*30);
    const days=[];
    for(let i=0;i<=n;i++){const d=addDays(t,i);if(d<ex.date)days.push(d);}
    const alloc={};
    while(need>0){
      let moved=false;
      for(let i=0;i<days.length;i++){
        const d=days[i];
        if(need<=0)break;
        if(cap[d]>=30){alloc[d]=(alloc[d]||0)+30;cap[d]-=30;need-=30;moved=true;}
      }
      if(!moved)break;
    }
    plan.short[ex.id]=Math.max(0,need);
    plan.planned[ex.id]=0;
    Object.keys(alloc).forEach(d=>plan.days[d].push({examId:ex.id,min:alloc[d],blocks:[]}));
  });
  Object.keys(plan.days).forEach(d=>{
    const fr=free[d];
    plan.days[d].forEach(sess=>{
      let left=sess.min;
      while(left>0){
        const chunk=Math.min(90,left);
        const iv=fr.find(f=>f.e-f.s>=30);
        if(!iv){plan.short[sess.examId]+=left;break;}
        const tt=Math.min(chunk,iv.e-iv.s);
        sess.blocks.push({s:iv.s,e:iv.s+tt});
        iv.s+=tt+15;left-=tt;
        plan.planned[sess.examId]+=tt;
      }
      sess.min=sess.blocks.reduce((a,b)=>a+(b.e-b.s),0);
    });
    plan.days[d]=plan.days[d].filter(s=>s.blocks.length);
  });
  return plan;
}
function dayInfo(st,plan,d){
  const cls=classIntervals(st,d),acts=actIntervals(st,d),sess=(plan.days[d]||[]).slice();
  const classMin=cls.reduce((a,c)=>a+(c.e-c.s),0);
  const actMin=acts.filter(a=>a.kind!=='rest').reduce((a,c)=>a+(c.e-c.s),0);
  const studyMin=sess.reduce((a,x)=>a+x.min,0);
  return {cls:cls,acts:acts,sess:sess,classMin:classMin,actMin:actMin,studyMin:studyMin,freeMin:Math.max(0,(DAY_END-DAY_START)-classMin-actMin-studyMin)};
}
function countdown(n){return n<0?'Rendida':n===0?'Hoy':n===1?'Mañana':'En '+n+' días';}
function streak(st,t){
  const days={};
  Object.keys(st.done).forEach(k=>{days[k.split('|')[0]]=1;});
  let d=days[t]?t:addDays(t,-1),n=0;
  while(days[d]){n++;d=addDays(d,-1);}
  return n;
}
function reminders(st,plan,t){
  const out=[];
  st.exams.filter(e=>e.date>=t).sort(byDate).forEach(ex=>{
    const n=dayDiff(t,ex.date),sb=subj(st,ex.subjectId);
    const name=(sb?sb.name:'Materia')+' · '+ex.title;
    const sess=(plan.days[t]||[]).find(s=>s.examId===ex.id);
    const tp=ex.topics&&n<=3?' Temas: '+ex.topics+'.':'';
    if(n===0)out.push({examId:ex.id,tone:'exam',tag:'Hoy',text:name+' es hoy. Repasa lo esencial y descansa bien esta noche.'});
    else if(n===1)out.push({examId:ex.id,tone:'exam',tag:'Mañana',text:name+'.'+(sess?' Hoy te tocan '+hrs(sess.min)+' de repaso.':' Haz un repaso corto y deja tiempo para dormir.')+tp});
    else if(st.settings.remindDays.indexOf(n)>=0)out.push({examId:ex.id,tone:n<=3?'warn':'',tag:'En '+n+' días',text:name+'.'+(sess?' Hoy te tocan '+hrs(sess.min)+' de estudio.':'')+tp});
    const sh=plan.short[ex.id]||0;
    if(n>0&&sh>0)out.push({examId:ex.id,tone:'warn',tag:'Tiempo justo',text:name+': faltan '+hrs(sh)+' para tu meta. Sube las horas diarias, agrega un día de estudio o baja la meta.'});
  });
  if(isRestDay(st,t))out.push({tone:'rest',tag:'Día libre',text:'Hoy no hay estudio planificado. Descansar también es parte del plan.'});
  return out;
}

/* ---------- persistencia ---------- */
function lsGet(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function setSync(kind){
  const el=$('sync');if(!el)return;
  const m={saving:'Guardando…',ok:store.mode==='account'?'Guardado en tu cuenta':'Guardado',error:'No se pudo guardar en tu cuenta'};
  el.textContent=m[kind]||'';
}
function changed(){render();scheduleSave();}
function scheduleSave(){clearTimeout(saveTimer);setSync('saving');saveTimer=setTimeout(doSave,500);}
function doSave(){
  saveTimer=null;
  lsSet();
  if(store.ref){
    const payload=JSON.parse(JSON.stringify(state));
    saving=saving.then(()=>store.ref.set({state:payload,savedAt:Date.now()})).then(()=>setSync('ok'),()=>{store.mode='local';setSync('error');});
  }else setSync('ok');
}
async function initStore(){
  try{
    const c=window.claude;
    if(!c||!c.use){store.mode='local';return;}
    const dbp=c.use('db'),usp=c.use('user');
    const db=await dbp,user=await usp;
    const id=user?await user.id():null;
    if(!db||!id){store.mode='local';render();return;}
    const ref=db.doc('data/users/'+id+'/plan');
    store.ref=ref;store.mode='account';
    const wait=setTimeout(()=>toast('No se pudo conectar con tu cuenta. Usando los datos de este navegador.'),10000);
    ref.onSnapshot(snap=>{
      clearTimeout(wait);
      if(snap.metadata.hasPendingWrites||saveTimer)return;
      const d=snap.exists?snap.data():null;
      if(d&&d.state){
        const remote=normalize(d.state);
        if(remote&&canon(remote)!==canon(state)){state=remote;lsSet();render();}
      }
    },()=>{clearTimeout(wait);store.mode='local';store.ref=null;render();});
  }catch(e){store.mode='local';}
}

function railHtml(d,info){
  const cl=m=>Math.max(DAY_START,Math.min(DAY_END,m));
  const pc=m=>(cl(m)-DAY_START)/(DAY_END-DAY_START)*100;
  const w=(a,b)=>(pc(b)-pc(a)).toFixed(2);
  let segs='';
  info.cls.forEach(c=>{segs+='<i class="seg cls" style="left:'+pc(c.s).toFixed(2)+'%;width:'+w(c.s,c.e)+'%;--c:'+c.subject.color+'" title="'+esc(c.subject.name)+'"></i>';});
  info.acts.forEach(a=>{segs+='<i class="seg '+(a.kind==='rest'?'rst':'cls')+'" style="left:'+pc(a.s).toFixed(2)+'%;width:'+w(a.s,a.e)+'%;--c:'+a.color+'" title="'+esc(a.title)+'"></i>';});
  info.sess.forEach(s=>s.blocks.forEach(b=>{segs+='<i class="seg stu" style="left:'+pc(b.s).toFixed(2)+'%;width:'+w(b.s,b.e)+'%"></i>';}));
  if(d===today()){const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m>=DAY_START&&m<=DAY_END)segs+='<i class="now" style="left:'+pc(m).toFixed(2)+'%" title="Ahora"></i>';}
  let ticks='';
  [8,12,16,20].forEach(h=>{ticks+='<span class="tk" style="left:'+pc(h*60).toFixed(2)+'%">'+pad(h)+'</span>';});
  return '<div class="rail" role="img" aria-label="Línea del día de 07:00 a 23:00">'+segs+'</div><div class="ticks" aria-hidden="true">'+ticks+'</div>';
}
function legend(info){

}
function plainItem(s,e,color,title,label,act,id){
  return '<li class="item"><div class="time">'+mt(s)+'<small>'+mt(e)+'</small></div><div class="body"><button class="lnk" data-act="'+act+'" data-id="'+id+'"><span class="dot" style="--c:'+color+'"></span><b>'+esc(title)+'</b><span class="meta">'+label+'</span></button></div><span></span></li>';
}
function studyItem(d,s,t){
  const ex=state.exams.find(e=>e.id===s.examId),sb=ex&&subj(state,ex.subjectId);
  if(!ex||!sb)return '';
  const key=d+'|'+ex.id,isDone=state.done[key]!=null;
  const chk=d<=t?'<label class="chk"><input type="checkbox" id="chk-'+d+'-'+ex.id+'" data-change="toggle" data-date="'+d+'" data-exam="'+ex.id+'" data-min="'+s.min+'" aria-label="Marcar estudio de '+esc(sb.name)+' como hecho"'+(isDone?' checked':'')+'><span></span></label>':'<span></span>';
  const first=s.blocks[0].s,last=s.blocks[s.blocks.length-1].e;
  return '<li class="item'+(isDone?' is-done':'')+'"><div class="time">'+mt(first)+'<small>'+mt(last)+'</small></div><div class="body"><button class="lnk" data-act="edit-exam" data-id="'+ex.id+'"><span class="dot" style="--c:var(--accent)"></span><b>Estudiar '+esc(sb.name)+'</b><span class="meta">'+esc(ex.type)+' · '+esc(ex.title)+' · '+countdown(dayDiff(t,ex.date)).toLowerCase()+' · '+hrs(s.min)+(ex.topics?'<br>Temas: '+esc(ex.topics):'')+'<br>'+s.blocks.map(b=>mt(b.s)+'–'+mt(b.e)).join(' · ')+'</span></button></div>'+chk+'</li>';
}
function dayBody(d,plan){
  const info=dayInfo(state,plan,d),t=today(),items=[];
  info.cls.forEach(c=>items.push({s:c.s,h:plainItem(c.s,c.e,c.subject.color,c.subject.name,'Clase','edit-subject',c.subject.id)}));
  info.acts.forEach(a=>items.push({s:a.s,h:plainItem(a.s,a.e,a.color,a.title,a.kind==='rest'?'Descanso':'Actividad','edit-activity',a.id)}));
  info.sess.forEach(s=>items.push({s:s.blocks[0].s,h:studyItem(d,s,t)}));
  items.sort((a,b)=>a.s-b.s);
  const manual=state.freeDates.indexOf(d)>=0,weeklyRest=state.settings.restDays.indexOf(wd(d))>=0,rest=manual||weeklyRest;
  let h=railHtml(d,info)+legend(info);
  if(items.length)h+='<ul class="list">'+items.map(i=>i.h).join('')+'</ul>';
  else h+='<p class="empty">'+(rest?'Día libre, sin clases ni estudio agendado.':'Nada agendado. Es tiempo libre.')+'</p>';
  if(rest&&items.length)h+='<p class="meta" style="margin-top:10px">Día libre: no se agenda estudio.</p>';
  if(info.classMin+info.actMin+info.studyMin>9*60)h+='<p class="warnline" style="margin-top:10px">Día cargado ('+hrs(info.classMin+info.actMin+info.studyMin)+'). Considera mover estudio a otro día.</p>';
  if(d>=t&&!weeklyRest)h+='<div><button class="linkbtn" data-act="free-day" data-date="'+d+'">'+(manual?'Volver a estudiar este día':'Marcar como día libre')+'</button></div>';
  return h;
}

function examDoneMin(id){return Object.keys(state.done).reduce((a,k)=>a+(k.split('|')[1]===id?state.done[k]:0),0);}
function examCard(ex,plan,t){
  const sb=subj(state,ex.subjectId);if(!sb)return '';
  const n=dayDiff(t,ex.date),dm=examDoneMin(ex.id),goal=ex.hours*60;
  const tone=n<0?'':n<=1?'exam':n<=3?'warn':'';

  return h+'</article>';

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  if(ev.target===$('sheet-bg')){closeSheet();return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab')setTab(b.dataset.tab);
  else if(a==='fab')openMenu();
  else if(a==='pick'){ui.sel=b.dataset.date;render();}
  else if(a==='pick-top'){ui.sel=b.dataset.date;render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='free-day')toggleFree(b.dataset.date);
  else if(a==='free-today'){closeSheet();if(state.freeDates.indexOf(today())<0)toggleFree(today());else toast('Hoy ya es día libre.');}
  else if(a==='new-exam')openExam('');
  else if(a==='edit-exam')openExam(b.dataset.id);
  else if(a==='save-exam')saveExam(b.dataset.id);
  else if(a==='hours-plus'||a==='hours-minus'){
    const ex=state.exams.find(e=>e.id===b.dataset.id);
    if(ex){ex.hours=Math.max(1,Math.min(80,ex.hours+(a==='hours-plus'?0.5:-0.5)));changed();}
  }
  else if(a==='del-exam'){
    if(!armed(b,'¿Seguro? Eliminar'))return;
    state.exams=state.exams.filter(e=>e.id!==b.dataset.id);
    Object.keys(state.done).forEach(k=>{if(k.split('|')[1]===b.dataset.id)delete state.done[k];});
    closeSheet();changed();toast('Evaluación eliminada');
  }
  else if(a==='new-subject')openSubject('');
  else if(a==='edit-subject')openSubject(b.dataset.id);
  else if(a==='save-subject')saveSubject(b.dataset.id);
  else if(a==='del-subject'){
    if(!armed(b,'¿Seguro? Se borran sus evaluaciones'))return;
    const ids=state.exams.filter(e=>e.subjectId===b.dataset.id).map(e=>e.id);
    state.exams=state.exams.filter(e=>e.subjectId!==b.dataset.id);
    Object.keys(state.done).forEach(k=>{if(ids.indexOf(k.split('|')[1])>=0)delete state.done[k];});
    state.subjects=state.subjects.filter(s=>s.id!==b.dataset.id);
    closeSheet();changed();toast('Materia eliminada');
  }
  else if(a==='new-activity')openActivity('');
  else if(a==='edit-activity')openActivity(b.dataset.id);
  else if(a==='save-activity')saveActivity(b.dataset.id);
  else if(a==='del-activity'){
    if(!armed(b,'¿Seguro? Eliminar'))return;
    state.activities=state.activities.filter(x=>x.id!==b.dataset.id);
    closeSheet();changed();toast('Actividad eliminada');
  }
  else if(a==='add-slot')$('f-slots').insertAdjacentHTML('beforeend',slotRow({d:0,s:'08:30',e:'10:00'}));
  else if(a==='rm-slot'){const r=b.closest('.srow');if(r)r.remove();}
  else if(a==='close')closeSheet();
  else if(a==='rest-day'){
    const i=parseInt(b.dataset.i,10),r=state.settings.restDays,k=r.indexOf(i);
    if(k>=0)r.splice(k,1);else r.push(i);
    changed();
  }
  else if(a==='remind-day'){
    const n=parseInt(b.dataset.n,10),r=state.settings.remindDays,k=r.indexOf(n);
    if(k>=0)r.splice(k,1);else r.push(n);
    changed();
  }
  else if(a==='clear-sample'){
    if(!armed(b,'¿Seguro? Borrar ejemplos'))return;
    state.sample=false;state.subjects=[];state.exams=[];state.activities=[];state.freeDates=[];state.done={};changed();toast('Ejemplos borrados. Empieza con tus materias.');setTab('materias');
  }
  else if(a==='reset'){
    if(!armed(b,'¿Seguro? Borrar todo'))return;
    const keep=state.settings;
    state={v:2,sample:false,settings:keep,subjects:[],exams:[],activities:[],freeDates:[],done:{}};changed();toast('Datos borrados');
  }
});
document.addEventListener('change',ev=>{
  const tg=ev.target;
  if(tg.matches&&tg.matches('input[type=radio][name$="-color"]')){
    const cu=$(tg.name+'-custom');
    if(cu){cu.dataset.on='0';cu.parentNode.classList.remove('on');}
    return;
  }
  const el=tg.closest('[data-change]');if(!el)return;
  const k=el.dataset.change;
  if(k==='toggle'){
    const key=el.dataset.date+'|'+el.dataset.exam;
    if(el.checked){
      state.done[key]=parseInt(el.dataset.min,10);
      buzz();
      const ex=state.exams.find(e=>e.id===el.dataset.exam);
      if(ex&&examDoneMin(ex.id)>=ex.hours*60)toast('Meta de estudio completa: '+ex.title+'.');
      else toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
    }else delete state.done[key];
    changed();
  }else if(k==='type'){
    const f=el.closest('.form');
    if(f&&f.dataset.editing!=='1'){const h=$('f-hours');if(h)h.value=typeOf(el.value).h;}
  }else if(k==='customcolor'){
    const n=el.dataset.name;
    document.querySelectorAll('input[name="'+n+'"]').forEach(r=>{r.checked=false;});
    el.dataset.on='1';el.parentNode.classList.add('on');el.parentNode.style.setProperty('--c',el.value);
  }else if(k==='repeat'){
    const once=el.value==='once';
    $('a-date-f').hidden=!once;$('a-days-f').hidden=once;
  }else if(k==='setting'){
    const s=state.settings,key=el.dataset.key;
    const next={studyStart:s.studyStart,studyEnd:s.studyEnd,maxHours:s.maxHours};
    if(key==='maxHours'){const v=parseFloat(el.value);if(!(v>=1&&v<=10)){toast('Elige entre 1 y 10 horas.');render();return;}next.maxHours=v;}
    else next[key]=el.value;
    if(!next.studyStart||!next.studyEnd||tm(next.studyEnd)-tm(next.studyStart)<60){toast('La ventana debe durar al menos 1 hora.');render();return;}
    s.studyStart=next.studyStart;s.studyEnd=next.studyEnd;s.maxHours=next.maxHours;
    changed();
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('sheet-bg').hidden)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.indexOf(t)>=0&&t!==ui.tab){ui.tab=t;render();enter();window.scrollTo(0,0);}});
/* deslizar para cambiar de día en la agenda */
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{
  if(ui.tab!=='agenda'||!$('sheet-bg').hidden||e.target.closest('.strip,input,select,textarea')){tx=null;return;}
  const p=e.touches[0];tx=p.clientX;ty=p.clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx==null)return;
  const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<45)shiftDay(dx<0?1:-1);
},{passive:true});

/* ---------- inicio ---------- */
(function start(){
  state=normalize(lsGet())||sampleState();
  const h=location.hash.slice(1);
  if(TABS.indexOf(h)>=0)ui.tab=h;
  render();enter();
  initStore();
})();
})();
</script>
